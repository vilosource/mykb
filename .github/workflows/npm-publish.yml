name: npm publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Leave blank to publish the current default-branch HEAD.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org

      - name: Test
        run: npm test

      - name: Publish to npm
        # prepublishOnly runs `clean && build` to ensure dist/ is fresh.
        # Pi-container bundles (dist/bundle/, dist/cli-bundle/) are NOT shipped
        # to npm — they are excluded by package.json `files`.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
